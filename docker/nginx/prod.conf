# Reverse proxy in front of the Node/Express app (which serves both the API and the built React SPA).
# Replace SEU_DOMINIO with your real domain before deploying.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SEU_DOMINIO;

    ssl_certificate /etc/nginx/ssl/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
